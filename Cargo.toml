[workspace]
members = ["crates/vaero-cli", "crates/vaero-core", "crates/vaero-crypto"]
resolver = "2"

[workspace.dependencies]
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
getrandom = "0.3"
sha2 = { version = "0.10", default-features = false }
zeroize = "1"

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/Kayyo321/Vaero"
rust-version = "1.98"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
